<div class="modal-header">
  <h5 class="modal-title">
    {{ title }}
  </h5>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    id="btnX"
    (click)="fecharModal(false)"
  ></button>
</div>
<div class="modal-body">
  {{ message }}
</div>
<div class="modal-footer">
  <button
    type="button"
    id="btnFechar"
    class="btn btn-secondary"
    (click)="fecharModal(false)"
  >
    Não
  </button>
  <button
    type="submit"
    id="btnSalvar"
    class="btn btn-success"
    (click)="fecharModal(true)"
  >
    Sim
  </button>
</div>
