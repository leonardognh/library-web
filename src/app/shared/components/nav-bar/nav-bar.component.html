<nav
  class="navbar navbar-expand-lg navbar-light bg-dark border-bottom border-body"
  data-bs-theme="dark"
>
  <div class="container-fluid">
    <a class="navbar-brand">Livraria </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <ng-container *ngFor="let menu of menus">
          <li class="nav-item" *ngIf="!menu.children">
            <a
              class="nav-link active"
              aria-current="page"
              [routerLink]="[menu.route]"
            >
              {{ menu.label }}
            </a>
          </li>
        </ng-container>
        <ng-container *ngFor="let menu of menus">
          <li class="nav-item dropdown" *ngIf="menu.children">
            <a
              class="nav-link dropdown-toggle"
              href="#"
              id="navbarDropdown"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              {{ menu.label }}
            </a>
            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
              <li *ngFor="let child of menu.children">
                <a class="dropdown-item" [routerLink]="[child.route]">
                  {{ child.label }}
                </a>
              </li>
            </ul>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</nav>
