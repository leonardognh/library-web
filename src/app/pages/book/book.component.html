<h3>Lista de Livros</h3>

<div class="d-flex justify-content-between">
  <div class="input-group me-3">
    <span class="input-group-text"><i class="bi bi-search"></i></span>
    <input
      type="text"
      class="form-control"
      placeholder="Pesquisar..."
      [formControl]="searchControl"
    />
  </div>
  <span class="d-flex align-items-center">
    <i
      class="bi bi-plus-circle-fill display-6 text-primary"
      (click)="openModal()"
    ></i>
  </span>
</div>

<ng-container *ngIf="books && books.length > 0">
  <table class="table mt-3">
    <thead>
      <tr>
        <th scope="col">Nome</th>
        <th scope="col">Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of books">
        <td>{{ item.title }}</td>
        <td>
          <i
            class="bi bi-pencil-fill text-secondary me-3"
            (click)="openModal(item)"
          ></i>
          <i
            class="bi bi-trash-fill text-danger"
            (click)="openModalDelete(item)"
          ></i>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="d-flex justify-content-center">
    <nav aria-label="Page navigation">
      <ul class="pagination">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a
            class="page-link"
            href="#"
            aria-label="Previous"
            (click)="goToPage(currentPage - 1)"
          >
            <span aria-hidden="true">&laquo;</span>
          </a>
        </li>

        <li
          class="page-item"
          *ngFor="let page of pages"
          [class.active]="page === currentPage"
        >
          <a class="page-link" (click)="goToPage(page)">{{ page }}</a>
        </li>

        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a
            class="page-link"
            href="#"
            aria-label="Next"
            (click)="goToPage(currentPage + 1)"
          >
            <span aria-hidden="true">&raquo;</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</ng-container>
<ng-container *ngIf="books && books.length === 0">
  <div class="d-flex justify-content-center">Não há livros cadastrados...</div>
</ng-container>
