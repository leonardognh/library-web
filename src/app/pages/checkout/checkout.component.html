<div class="container mt-4">
  <h2>Finalizar Compra</h2>
  <hr />

  <div *ngIf="products.length === 0" class="alert alert-warning">
    Seu carrinho está vazio.
  </div>

  <div
    *ngFor="let product of products"
    class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-2"
  >
    <div>
      <strong>{{ product.book?.title }}</strong>
      <br />
      <span>Preço: R$ {{ product.price | number : "1.2-2" }}</span>
      <br />
      <span>Quantidade: {{ product.quantity }}</span>
    </div>
    <span
      ><strong>Subtotal:</strong> R$
      {{ product.price * product.quantity | number : "1.2-2" }}</span
    >
  </div>

  <h4 class="mt-3">Total: R$ {{ total | number : "1.2-2" }}</h4>

  <button
    class="btn btn-success mt-3"
    (click)="buy()"
    [disabled]="products.length === 0"
  >
    Confirmar Compra
  </button>
</div>
